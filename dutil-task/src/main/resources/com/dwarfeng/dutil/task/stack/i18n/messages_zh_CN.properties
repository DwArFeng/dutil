# dutil-task 简体中文消息。
task.execution.cancelled=任务执行已取消。
task.progress.fraction_invalid=任务进度必须是 0 到 1 之间的有限数值。
task.result.state_not_terminal=任务结果必须处于终止状态。
task.result.finish_before_start=任务结束时间不能早于开始时间。
task.result.failure_required=失败或超时的任务结果必须包含失败原因。
task.result.failure_forbidden=只有失败或超时的任务结果可以包含失败原因。
task.execution.timeout_negative=任务超时时间不能为负数。
task.retry.attempts_invalid=最大尝试次数必须为正数。
task.retry.delay_negative=重试延迟不能为负数。
task.schedule.duration_negative=调度时长不能为负数。
task.schedule.interval_not_positive=重复调度必须使用正数间隔。
