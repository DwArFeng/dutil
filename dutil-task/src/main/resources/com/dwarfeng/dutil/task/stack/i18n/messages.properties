# dutil-task English root messages.
task.execution.cancelled=Task execution was cancelled.
task.progress.fraction_invalid=Progress fraction must be finite and between 0 and 1.
task.result.state_not_terminal=Task result state must be terminal.
task.result.finish_before_start=Task finish time must not be before its start time.
task.result.failure_required=A failed or timed-out task result requires a failure.
task.result.failure_forbidden=Only a failed or timed-out task result may contain a failure.
task.execution.timeout_negative=Task timeout must not be negative.
task.retry.attempts_invalid=Maximum retry attempts must be positive.
task.retry.delay_negative=Retry delay must not be negative.
task.schedule.duration_negative=Schedule durations must not be negative.
task.schedule.interval_not_positive=A repeating schedule requires a positive interval.
